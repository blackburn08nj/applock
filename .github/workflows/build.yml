name: Build AppLock

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      
      - name: Build AppLock (arm64)
        run: |
          xcodebuild -project AppLock.xcodeproj \
            -scheme AppLock \
            -configuration Release \
            -derivedDataPath ./DerivedData_arm64 \
            -arch arm64 \
            build    

      - name: Build AppLock (x86_64)
        run: |
          xcodebuild -project AppLock.xcodeproj \
            -scheme AppLock \
            -configuration Release \
            -derivedDataPath ./DerivedData_x86_64 \
            -arch x86_64 \
            build    
      
      - name: Create universal binary
        run: |
          # Create full app bundle structure
          mkdir -p ./DerivedData/Build/Products/Release/AppLock.app/Contents/MacOS
          mkdir -p ./DerivedData/Build/Products/Release/AppLock.app/Contents/Resources
    
          # Copy Info.plist and resources from arm64 build
          cp ./DerivedData_arm64/Build/Products/Release/AppLock.app/Contents/Info.plist \
             ./DerivedData/Build/Products/Release/AppLock.app/Contents/Info.plist
          cp -R ./DerivedData_arm64/Build/Products/Release/AppLock.app/Contents/Resources/* \
             ./DerivedData/Build/Products/Release/AppLock.app/Contents/Resources/
          cp -R ./DerivedData_arm64/Build/Products/Release/AppLock.app/Contents/Frameworks \
             ./DerivedData/Build/Products/Release/AppLock.app/Contents/ 2>/dev/null || true
    
          # Create universal binary
          lipo -create \
            ./DerivedData_arm64/Build/Products/Release/AppLock.app/Contents/MacOS/AppLock \
            ./DerivedData_x86_64/Build/Products/Release/AppLock.app/Contents/MacOS/AppLock \
            -output ./DerivedData/Build/Products/Release/AppLock.app/Contents/MacOS/AppLock
    
          # Verify
          file ./DerivedData/Build/Products/Release/AppLock.app/Contents/MacOS/AppLock    
    

      - name: Create archive
        run: |
          ditto -c -k --keepParent ./DerivedData/Build/Products/Release/AppLock.app AppLock.zip
          ls -la AppLock.zip 
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-macOS
          path: AppLock.zip
          retention-days: 7
